<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://cdn.syncfusion.com" crossorigin />
    <title>Precision Plant</title>
    <meta name="description" content="Line status, shift scheduling, order planning, defect analysis and live floor flow for a discrete assembly plant." />
    <script>
      try {
        var saved = localStorage.getItem('precision-plant.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* storage blocked: light */ }
    </script>
    <!-- startup-preload -->
    <style>
      :root { --app-loading-bg: #f8fafc; --app-loading-fg: #667085; --app-loading-ring: #175cd3; --app-loading-track: #dbe5f5; }
      :root[data-theme='dark'] { --app-loading-bg: #0f172a; --app-loading-fg: #94a3b8; --app-loading-ring: #60a5fa; --app-loading-track: #1e3a6e; }
      html, body { margin: 0; background: var(--app-loading-bg); }
      .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        min-height: 240px; padding: 24px; box-sizing: border-box; color: var(--app-loading-fg);
        font: 500 14px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .app-loading__ring { width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid var(--app-loading-track); border-top-color: var(--app-loading-ring); animation: app-loading-spin 0.8s linear infinite; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading__ring { animation: none; border-color: var(--app-loading-ring); } }
      :root { --boot-page: #f6f8fb; --boot-surface: #ffffff; --boot-border: #e5e9f0; --boot-fg: #172033; --boot-muted: #667085; --boot-brand-bg: #eef4ff; --boot-brand-fg: #175cd3; }
      :root[data-theme='dark'] { --boot-page: #020617; --boot-surface: #0f172a; --boot-border: #334155; --boot-fg: #f8fafc; --boot-muted: #94a3b8; --boot-brand-bg: #172554; --boot-brand-fg: #60a5fa; }
      #app-boot { position: fixed; inset: 0; z-index: 1000; display: flex; background: var(--boot-page); color: var(--boot-fg);
        font: 400 12px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot-side { flex: 0 0 240px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 0; background: var(--boot-surface); border-right: 1px solid var(--boot-border); overflow: hidden; }
      .boot-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 40px; }
      .boot-logo { flex: 0 0 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--boot-brand-bg); color: var(--boot-brand-fg); font-size: 14px; font-weight: 700; }
      .boot-brand strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; }
      .boot-brand small { display: block; font-size: 12px; color: var(--boot-muted); white-space: nowrap; }
      /* First-paint sketch only. The navbar is SidebarComponent in AppShell, not this block. */
      .boot-links { margin: 0; padding: 0 12px; display: grid; gap: 4px; }
      .boot-links div { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; color: var(--boot-muted); white-space: nowrap; }
      .boot-links div.is-current { background: var(--boot-brand-bg); color: var(--boot-brand-fg); font-weight: 600; }
      .boot-foot { margin-top: auto; padding: 0 16px; color: var(--boot-muted); }
      .boot-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .boot-head { flex: 0 0 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: var(--boot-surface); border-bottom: 1px solid var(--boot-border); }
      .boot-head strong { font-size: 14px; font-weight: 700; }
      .boot-main { flex: 1; padding: 24px; }
      #app-boot[data-nav='docked'] .boot-side { flex-basis: 64px; }
      #app-boot[data-nav='docked'] .boot-brand > span, #app-boot[data-nav='docked'] .boot-links span, #app-boot[data-nav='docked'] .boot-foot { display: none; }
      #app-boot[data-nav='docked'] .boot-links div { justify-content: center; padding: 0; }
      #app-boot[data-nav='drawer'] .boot-side { display: none; }
    </style>
  </head>
  <body>
    <div id="app-boot" aria-busy="true">
      <aside class="boot-side" aria-hidden="true">
        <div class="boot-brand"><div class="boot-logo">PP</div><span><strong>Precision Plant</strong><small>Line, schedule, quality</small></span></div>
        <nav class="boot-links" aria-hidden="true">
          <div data-route="command"><span>Command</span></div>
          <div data-route="schedule"><span>Schedule</span></div>
          <div data-route="orders"><span>Orders</span></div>
          <div data-route="quality"><span>Quality</span></div>
          <div data-route="floor"><span>Floor</span></div>
        </nav>
        <div class="boot-foot">Built with Syncfusion</div>
      </aside>
      <div class="boot-work">
        <div class="boot-head"><strong id="boot-title">Command</strong></div>
        <div class="boot-main"><div class="app-loading" role="status" aria-live="polite"><div class="app-loading__ring" aria-hidden="true"></div><div id="boot-label">Loading Command…</div></div></div>
      </div>
    </div>
    <script>
      (function () {
        var boot = document.getElementById('app-boot');
        var labels = { command: 'Command', schedule: 'Schedule', orders: 'Orders', quality: 'Quality', floor: 'Floor' };
        var path = location.pathname.replace(/^\/manufacturing-production-quality-dashboard\/react/, '').replace(/^\//, '').split('/')[0] || 'command';
        var id = labels[path] ? path : 'command';
        var collapsed = false; try { collapsed = localStorage.getItem('precision-plant-nav-collapsed') === 'true'; } catch (e) {}
        boot.setAttribute('data-nav', window.innerWidth < 1024 ? 'drawer' : collapsed ? 'docked' : 'expanded');
        document.getElementById('boot-title').textContent = labels[id];
        document.getElementById('boot-label').textContent = 'Loading ' + labels[id] + '\u2026';
        var current = boot.querySelector('[data-route="' + id + '"]'); if (current) current.className = 'is-current';
        if (path === 'healthz') boot.remove();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
